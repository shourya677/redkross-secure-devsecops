[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redkross-secure-repository-starter"
version = "1.0.0"
description = "Reusable secure-repository starter with automated DevSecOps checks"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
